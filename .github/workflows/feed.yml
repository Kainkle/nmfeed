# nmfeed — the feed itself. Every 5 min: one fresh cycle (28 ESPN scoreboards + 1 mut
# listing, ~29 requests from GitHub's IPs — same politeness envelope as the worker design)
# → docs/{live,day,report}.json, committed when changed and served via raw.githubusercontent.
# No deps, no cache, no state between runs: the git commit is the persistence.
name: feed
on:
  schedule:
    - cron: "2-57/5 * * * *" # off the round minutes — GitHub delays cluster at :00/:05 starts
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: feed
  cancel-in-progress: false # queue the next run behind the current one, never pile

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          # no cache input: zero npm deps, nothing to cache
      - name: build
        run: node scripts/build.mjs docs
      - name: commit if changed
        run: |
          if [ -n "$(git status --porcelain docs/)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add docs/
            git commit -m "feed: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            git push
          else
            echo "no feed changes; nothing to commit"
          fi
